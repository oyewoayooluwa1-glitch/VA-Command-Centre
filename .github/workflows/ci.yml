name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Dummy values so `next build` succeeds — no real Supabase calls
          # happen at build time, only in the browser and on request.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Once sql/isolation_test.md has a scripted equivalent (Vitest hitting
  # Supabase's REST API with two real test users), add a job here that
  # runs it against a preview Supabase project on every PR.
